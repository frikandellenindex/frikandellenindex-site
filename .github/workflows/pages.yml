name: Site bouwen en publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Elke ochtend opnieuw bouwen (05:00 UTC = 06:00 in de winter, 07:00 in de zomer),
    # zodat berichten met een datum in de toekomst vanzelf verschijnen (document 19, C1).
    - cron: "0 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
